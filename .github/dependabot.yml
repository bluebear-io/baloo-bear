# Dependabot PRs that pass the Dependabot gate (.github/workflows/dependabot-gate.yml)
# are approved and merged automatically. The 28-day cooldown and the semver-major
# ignore keep version updates within that gate; security updates bypass both, and
# the gate then leaves majors and young releases to a human reviewer.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 28
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    # Only manage direct dependencies declared in pyproject.toml. The uv updater
    # otherwise bumps transitive deps inside the generated, hash-pinned
    # requirements-prod.txt export without touching uv.lock, which always fails
    # the CI "Check production requirements export" step (dependabot-core#13912).
    # Transitive pins still move whenever a direct dependency is re-resolved.
    allow:
      - dependency-type: "direct"

  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 28
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]

  - package-ecosystem: "npm"
    directory: "/extensions"
    cooldown:
      default-days: 28
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 28
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:45"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 28
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    cooldown:
      default-days: 28
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

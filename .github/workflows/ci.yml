name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Check production requirements export
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --output-file /tmp/requirements-prod.txt
          diff -u requirements-prod.txt /tmp/requirements-prod.txt

      - name: Lint (ruff)
        run: uv run ruff check baloo tests

      - name: Format check (black)
        run: uv run black --check baloo tests

      - name: Tests
        run: uv run pytest -x -q
        env:
          APP_ENVIRONMENT: test
          BALOO_ENV_FILE: /tmp/baloo-ci.env

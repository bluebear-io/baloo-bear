name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Check production requirements export
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --output-file /tmp/requirements-prod.txt
          diff -u requirements-prod.txt /tmp/requirements-prod.txt

      - name: Lint (ruff)
        run: uv run ruff check baloo tests

      - name: Format check (black)
        run: uv run black --check baloo tests

      - name: Tests
        run: uv run pytest -x -q
        env:
          APP_ENVIRONMENT: test
          BALOO_ENV_FILE: /tmp/baloo-ci.env

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Check production requirements export
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --output-file /tmp/requirements-prod.txt
          diff -u requirements-prod.txt /tmp/requirements-prod.txt

      - name: Lint (ruff)
        run: uv run ruff check baloo tests

      - name: Format check (black)
        run: uv run black --check baloo tests

      - name: Tests
        run: uv run pytest -x -q
        env:
          APP_ENVIRONMENT: test
          BALOO_ENV_FILE: /tmp/baloo-ci.env

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Baloo Dashboard{% endblock %}</title>
  <script>
    // Stamp the theme before first paint so it never flashes.
    try {
      var t = localStorage.getItem("baloo-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/dashboard-static/baloo.css">
  <script src="/dashboard-static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/dashboard/" class="brand">Baloo</a>
      <nav class="nav">
        <a href="/dashboard/" {% if active_page == 'overview' %}aria-current="page"{% endif %}>Overview</a>
        <a href="/dashboard/reviews" {% if active_page == 'reviews' %}aria-current="page"{% endif %}>Reviews</a>
        <a href="/dashboard/analytics" {% if active_page == 'analytics' %}aria-current="page"{% endif %}>Analytics</a>
        <a href="/dashboard/outcomes" {% if active_page == 'outcomes' %}aria-current="page"{% endif %}>Outcomes</a>
        <a href="/dashboard/settings" {% if active_page == 'settings' %}aria-current="page"{% endif %}>Settings</a>
      </nav>
      <button type="button" class="btn btn--ghost" id="theme-toggle"
              style="margin-left:auto" aria-label="Toggle color theme">
        <span id="theme-toggle-label">Theme</span>
      </button>
    </div>
  </header>

  <main class="main">
    {% block page_head %}
    {% if page_title %}
    <div class="page-head">
      <div>
        <h1>{{ page_title }}</h1>
        {% if page_subtitle %}<p>{{ page_subtitle }}</p>{% endif %}
      </div>
      {% block page_actions %}{% endblock %}
    </div>
    {% endif %}
    {% endblock %}

    {% block content %}{% endblock %}
  </main>

  <script src="/dashboard-static/chart.umd.js"></script>
  <script src="/dashboard-static/charts.js"></script>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("theme-toggle");
      var label = document.getElementById("theme-toggle-label");

      function current() {
        return root.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }
      function paint() { label.textContent = current() === "dark" ? "Light" : "Dark"; }

      btn.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("baloo-theme", next); } catch (e) {}
        paint();
        if (window.BalooCharts) window.BalooCharts.retheme();
      });
      paint();
    })();

    function convertTimestamps(root) {
      root.querySelectorAll("time.local-time").forEach(function (el) {
        var d = new Date(el.getAttribute("datetime"));
        if (!isNaN(d)) {
          el.textContent = d.getFullYear() + "-" +
            String(d.getMonth() + 1).padStart(2, "0") + "-" +
            String(d.getDate()).padStart(2, "0") + " " +
            String(d.getHours()).padStart(2, "0") + ":" +
            String(d.getMinutes()).padStart(2, "0");
        }
      });
      root.querySelectorAll("time.local-time-short").forEach(function (el) {
        var d = new Date(el.getAttribute("datetime"));
        if (!isNaN(d)) {
          el.textContent = String(d.getHours()).padStart(2, "0") + ":" +
            String(d.getMinutes()).padStart(2, "0") + ":" +
            String(d.getSeconds()).padStart(2, "0");
        }
      });
    }
    convertTimestamps(document);
    document.body.addEventListener("htmx:afterSwap", function (e) {
      convertTimestamps(e.detail.target);
    });
  </script>
</body>
</html>

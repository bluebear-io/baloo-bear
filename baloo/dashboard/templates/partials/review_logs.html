{% if logs %}
<div class="table-wrap">
  <table class="table">
    <thead><tr><th>Time</th><th>Event</th><th>Message</th></tr></thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td><time class="local-time-short" datetime="{{ log.created_at.isoformat() }}">{{ log.created_at }}</time></td>
        <td><span class="chip">{{ log.event_type }}</span></td>
        <td style="max-width:48rem">{{ log.message }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="empty">No log entries</div>
{% endif %}
